[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "PySMACKS"
version = "1.0.0-beta"
description = "PySMACKS"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Bastien Molcrette", email = "bastien.molcrette@unibas.ch"}]
keywords = ["smFRET", "single-molecule", "image analysis", "bioimaging", "fluorescence", "HMM"]
license = "MIT"
dependencies = [
	"numpy>=2.0",
    "matplotlib>=3.8",
    "pandas>=2.2",
    "PyQt5>=5.15",
    "scipy>=1.12",
    "scikit-image>=0.22",
    "big-fish>=0.6.2",
    "hmmlearn>=0.3.3",
    "opencv-python>=4.8",
    "openfret>=0.1.3",
    "pillow>=10.0",
    "ruptures>=1.1.10",
    "seaborn>=0.13",
    "trackpy>=0.6",
    "tvdcondat2013>=0.1.5",
    "uuid7>=0.1.0",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[project.scripts]
PySMACKS_GUI = "PySMACKS.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[project.urls]
Documentation = "https://pysmacks.readthedocs.io/"
Repository = "https://github.com/molcretb/PySMACKS"